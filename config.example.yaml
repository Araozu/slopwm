# SPDX-License-Identifier: 0BSD
# Complete reference for every supported setting and keybinding action.
# Active values below match the built-in defaults.
#
# Copy to $XDG_CONFIG_HOME/slopwm/config.yml, or ~/.config/slopwm/config.yml
# when XDG_CONFIG_HOME is unset or invalid. Alternatively, pass --config PATH.
# Validate without Wayland: cargo run -- --config config.example.yaml --check-config
# Reload after editing with Super+Shift+r or SIGHUP. Invalid reloads retain
# the last working configuration, including its bindings.
# Unknown settings/actions and duplicate shortcuts are rejected.

# Keyboard repeat for all keyboards, including those connected later.
# Omitting this section or either field uses its default.
keyboard:
  # Nonnegative integer in repeats per second; 0 disables repeat. Default: 40.
  repeat_rate: 40

  # Nonnegative integer in milliseconds before repeating starts. Default: 400.
  repeat_delay: 400

# Scrolling, column/stack movement, and tile resize animations.
# Omitting this section or any field uses its default. Reload applies changes.
animations:
  # Set false to apply layout changes immediately. Default: true.
  enabled: true

  # Integer milliseconds, 0 through 60000; 0 also disables animation.
  # Uses cubic ease-out and continues from the displayed tile on interruption.
  # Default: 200.
  duration_ms: 200

  # Integer milliseconds between frame requests, 1 through 1000. Default: 16.
  # Frames stop when animations finish; idle sessions have no timer wakeups.
  frame_interval_ms: 16

# Window borders. Omitting this section or any field uses its default.
# Both colors accept alpha via "#RRGGBBAA".
border:
  # Nonnegative integer in logical pixels; 0 disables borders. Default: 2.
  # Borders are included in tile dimensions and shrink on very small tiles.
  width: 2

  # Focused window border. Quoted "#RRGGBB" or "#RRGGBBAA";
  # AA is alpha (00 transparent, ff opaque).
  # Default: "#ffffff" (opaque white). True fullscreen suppresses borders.
  color: "#ffffff"

  # Unfocused window border. Same "#RRGGBB"/"#RRGGBBAA" syntax with alpha.
  # Default: "#808080ff" (opaque gray). Only the active monitor's selected
  # window uses `color`; every other visible tile uses this color.
  unfocused_color: "#808080ff"

# Window gaps in logical pixels. Omitting this section or any field uses its default.
# Gaps show the wallpaper behind them; true fullscreen bypasses gaps entirely.
gaps:
  # Nonnegative integer between adjacent columns and stacked rows. Default: 0.
  # Tile widths are unchanged; gaps add spacing between tiles and count toward
  # scrolling, centering, and right alignment.
  inner: 0

  # Nonnegative integer around the tiling area on every side, inside panels.
  # Default: 0. Shrinks the area used for widths, scrolling, dialogs, and the
  # spawn preview. Oversized gaps hide tiles until gaps shrink.
  outer: 0

# Scrolling layout. Omitting this section or either field uses its default.
scrolling:
  # left | right: side of the focused column where new windows are inserted.
  # Also chooses the side where unstack creates a new column. Default: left.
  growth_direction: left

  # Integer from 1 through 98, as a percentage of the monitor width. Default: 50.
  # Applies to new windows; existing columns retain their own widths.
  default_width_percent: 50

# Per-monitor overrides. Default: {} (all monitors use the global direction).
# Keys are Wayland output names, such as DP-1 or HDMI-A-1.
# Output names require wl_output version 4; older outputs use the global setting.
# Replace monitors: {} with the commented map below to enable overrides.
monitors: {}
# monitors:
#   DP-1:
#     growth_direction: right # left | right; required for each monitor entry.
#   HDMI-A-1:
#     growth_direction: left

# Keyboard shortcuts. This map REPLACES all built-in keyboard bindings.
# Omit the entire map to keep the defaults; keybindings: {} disables them.
# Rename a shortcut to rebind it, or bind the same action to several distinct keys.
#
# Syntax: zero or more modifiers joined by '+', followed by an XKB keysym name.
# Keys are case-sensitive and follow the active keyboard layout. Examples:
# q, space, Return, Escape, F1, equal, minus, plus, XF86AudioMute.
# Modifier names are case-insensitive; these are all supported names/aliases:
#   Shift
#   Ctrl | Control
#   Alt | Mod1
#   Super | Logo | Mod4
#   Mod3
#   Mod5
# For example, Ctrl+Alt+Return combines modifiers; F1 has no modifier.
# Do not repeat a modifier or bind the same shortcut through different aliases.
#
# Focus never follows the mouse. Clicking a window focuses and raises it.
# All focus navigation stops at the edges; nothing wraps around.
# Super + arrows: windows; Super + Alt + arrows: screens/workspaces.
# Add Shift to Super + Alt + arrows to move the focused window and follow it.
keybindings:
  # Start a terminal. spawn takes [executable, argument, ...].
  # Arguments run directly, with no shell expansion; quote arguments with spaces.
  "Super+space":
    spawn: [foot]

  # Start a terminal with the Enter key as well (Super is the Windows key).
  "Super+Return":
    spawn: [foot]

  # Ask the focused application window to close.
  "Super+q": close

  # Focus columns in physical left-to-right order in the active workspace.
  # Stop at either end and preserve the selected row when possible.
  "Super+Right": focus-next
  "Super+Left": focus-previous

  # Focus the row above/below in the current column, stopping at the top/bottom.
  "Super+Up": focus-up
  "Super+Down": focus-down

  # Move the focused column (with all its stacked rows) one step right/left
  # within the active workspace. Stops at either end of the strip.
  "Super+Ctrl+Shift+Right": move-next
  "Super+Ctrl+Shift+Left": move-previous

  # Center the focused column in the monitor, or align its right edge to the
  # 99% mark (1% peek margin on the right). Both keep the 1% left/right peeks.
  "Super+c": center-window
  "Super+Shift+c": align-window-right

  # Move the focused window into the column to the right/left, below its rows.
  # Rows share the target column's width and split its height equally.
  # If there is no neighboring column in that direction, nothing happens.
  "Super+Shift+Right": stack-next
  "Super+Shift+Left": stack-previous

  # Give the focused window its own column on the configured growth side.
  "Super+u": unstack

  # Focus the next/previous monitor by River's output positions, stopping at ends.
  # Each monitor remembers its selected tile; empty monitors can be focused too.
  "Super+Alt+Right": focus-output-next
  "Super+Alt+Left": focus-output-previous

  # Move the focused window to the next/previous monitor and follow it.
  # Uses that monitor's selected workspace and configured growth side.
  # A stacked row becomes its own column; its regular width percentage is kept.
  # Moves leave fullscreen and stop at the first/last monitor.
  "Super+Alt+Shift+Right": move-to-output-next
  "Super+Alt+Shift+Left": move-to-output-previous

  # Switch workspaces on the active monitor, stopping at the top/bottom.
  # Each monitor has one empty workspace below its occupied workspaces.
  # Empty workspaces above the bottom are removed automatically.
  "Super+Alt+Up": focus-workspace-up
  "Super+Alt+Down": focus-workspace-down

  # Move the focused window to the workspace above/below and follow it.
  # A stacked row gets its own column; the remaining rows stay together.
  # Moves leave fullscreen and keep the regular width.
  "Super+Alt+Shift+Up": move-to-workspace-up
  "Super+Alt+Shift+Down": move-to-workspace-down

  # Use 98% of the monitor width and available height, temporarily hiding sibling
  # rows. Toggle again to restore the previous width and vertical stack.
  "Super+f": toggle-soft-fullscreen

  # Toggle River fullscreen, covering the whole monitor; toggle off to restore
  # the tile. Focusing another tile in the same workspace also leaves fullscreen.
  "Super+Shift+f": toggle-fullscreen

  # Add/subtract percentage POINTS of monitor width for the focused column.
  # Each binding accepts an integer from -97 through 97, excluding 0.
  # Width is clamped to 1–98%; stacked rows resize together. Leaves fullscreen.
  "Super+equal": {change-width-percent: 10}
  "Super+minus": {change-width-percent: -10}

  # Select the side of the focused tile for the next regular app window.
  # A translucent arrow previews the selected direction; repeat to clear it.
  "Super+Ctrl+Left": preselect-left
  "Super+Ctrl+Right": preselect-right
  "Super+Ctrl+Up": preselect-up
  "Super+Ctrl+Down": preselect-down
  "Super+Ctrl+Escape": preselect-cancel

  # Validate and apply this file again without restarting the session.
  "Super+Shift+r": reload-config

  # Exit the entire Wayland session.
  "Super+Shift+Escape": exit

  # Stop only the window manager, keeping River and applications alive.
  # No built-in shortcut; SIGTERM and SIGINT also request graceful shutdown.
  # "Super+Ctrl+Shift+Escape": quit

  # Optional bindings: uncomment within this map; install the commands you use.
  # The terminal title below is passed as one argument, including its space.
  # "Super+Shift+space": {spawn: [foot, --title, "My terminal"]}
  # "Super+d": {spawn: [fuzzel]}

  # Shell syntax (such as $HOME, pipes, or redirection) needs an explicit shell.
  # "Super+Shift+Return": {spawn: [sh, -c, 'exec foot --working-directory="$HOME"']}

  # Media keys can be bound without modifiers.
  # "XF86AudioMute": {spawn: [wpctl, set-mute, "@DEFAULT_AUDIO_SINK@", toggle]}
  # "XF86AudioRaiseVolume": {spawn: [wpctl, set-volume, "@DEFAULT_AUDIO_SINK@", "5%+"]}
  # "XF86AudioLowerVolume": {spawn: [wpctl, set-volume, "@DEFAULT_AUDIO_SINK@", "5%-"]}
