[package]
name = "slopwm"
version = "0.1.0"
edition = "2024"
description = "A small scrolling tiling window manager for River"
license = "0BSD"

[dependencies]
bitflags = "2.11.0"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
wayland-backend = "0.3.14"
wayland-client = "0.31.13"
wayland-scanner = "0.31.9"
xkbcommon = { version = "0.9", default-features = false }
